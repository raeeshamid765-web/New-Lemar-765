<style>
/* Layout: sticky command bar with scrollable tabs above a card grid. A period bar (Gregorian or Solar Hijri) drives dashboard and reports; every cost flows purchase -> unit/job -> invoice so profit is real. */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface2:#F4F6FA; --ink:#0F1728; --muted:#5B6780; --line:#D9DEE8; --logo:#0B1F4D;
  --accent:#A47716; --accent-soft:#F4EAD0; --win:#08966F; --loss:#D23B55; --warn:#C47F0E; --grid:#E3E7EF; --blue:#3C5FD9;
  --shadow:0 1px 2px rgba(15,23,40,.06),0 10px 30px rgba(15,23,40,.06);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080D1A; --surface:#111A2F; --surface2:#17223D; --ink:#E7ECF6; --muted:#8B97B1; --line:#24304C; --logo:#FFFFFF;
  --accent:#E3B65A; --accent-soft:#2F2610; --win:#2FD0A0; --loss:#FF6B82; --warn:#F2B13E; --grid:#1B2640; --blue:#7C97FF;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 34px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080D1A; --surface:#111A2F; --surface2:#17223D; --ink:#E7ECF6; --muted:#8B97B1; --line:#24304C; --logo:#FFFFFF;
  --accent:#E3B65A; --accent-soft:#2F2610; --win:#2FD0A0; --loss:#FF6B82; --warn:#F2B13E; --grid:#1B2640; --blue:#7C97FF;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 34px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;padding-block:0 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;display:inline-block}
.pos{color:var(--win)} .neg{color:var(--loss)} .mut{color:var(--muted)} .warnc{color:var(--warn)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin-inline:auto}
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand svg{width:40px;height:40px;color:var(--logo);flex:none}
.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted);margin-top:-3px}
.acct{margin-inline-start:auto;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.acct small{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.12em}
.acct .big{font-size:17px;font-weight:600}
.save{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save b{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.save.ok b{background:var(--win)}
nav.tabs{max-width:1320px;margin-inline:auto;display:flex;gap:2px;overflow-x:auto;margin-top:8px;position:relative;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap;transition:color .2s}
nav.tabs button[aria-selected="true"],nav.tabs button:hover{color:var(--ink)}
nav.tabs .ind{position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transition:left .45s cubic-bezier(.3,1.2,.4,1),width .45s cubic-bezier(.3,1.2,.4,1)}
main{padding-top:22px;display:flex;flex-direction:column;gap:16px}
main>*,.stag{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);border-radius:12px;padding:10px 16px;font-size:13px}
.banner button{margin-inline-start:auto}
.grid{display:grid;gap:16px;min-width:0}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media(max-width:880px){.g-2,.g-eq{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0;position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--accent) 10%,transparent),transparent 62%)}
.card:hover::before{opacity:1}
.card h3{margin:0 0 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;font-weight:700;text-transform:uppercase}
.kpi .v{font-size:23px;font-weight:600;line-height:1.35;letter-spacing:-.02em}
.kpi .s{font-size:11px;color:var(--muted);min-height:16px}
.delta{font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 15px;font-weight:700;font-size:13px;transition:transform .18s,box-shadow .18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#fff));border-color:transparent;color:#171103}
.btn.danger{color:var(--loss)}
.btn.sm{padding:3px 11px;font-size:12px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:4px 14px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{display:inline-block;padding:1px 10px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--grid);white-space:nowrap}
.status.Paid,.status.OK,.status.Sold,.status.Delivered,.status.Done{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.status.Partial,.status.LOW,.status.Instock,.status.Inprogress{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.status.Unpaid,.status.OUT{background:color-mix(in srgb,var(--loss) 18%,transparent);color:var(--loss)}
.status.Planned{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:start;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th.r,td.r{text-align:end}
tbody tr[data-edit],tbody tr[data-inv],tbody tr[data-pur],tbody tr[data-unit],tbody tr[data-job]{cursor:pointer}
tbody tr{animation:rise .35s backwards;animation-delay:calc(var(--i,0)*14ms)}
tbody tr:hover{background:var(--surface2)}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.scroll{overflow-x:auto}
.jal{display:block;font-size:11px;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600;min-height:16px}
.sub{font-size:11px;color:var(--muted);display:block;line-height:1.2}
.brow{display:grid;grid-template-columns:minmax(100px,1.2fr) 3fr minmax(90px,.9fr);gap:10px;align-items:center;padding:5px 0;font-size:12px}
.brow .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.brow .r{text-align:end;white-space:nowrap}
.bz{position:relative;height:14px;background:var(--grid);border-radius:5px;overflow:hidden}
.bz .b{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:3px;transition:width 1.1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*50ms)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.legend{display:flex;gap:16px;font-size:11px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{width:auto;min-width:130px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px}
label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink);width:100%;min-width:0;font-size:13px;letter-spacing:0;text-transform:none;font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);outline:0}
input:read-only{opacity:.7}
textarea{resize:vertical;min-height:70px}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.pbar .f{align-items:end}
.ptxt{font-size:12px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(6,10,20,.62);backdrop-filter:blur(3px);z-index:40;display:grid;place-items:start center;overflow:auto;padding:16px 12px 24px;animation:fade .25s}
.ov .card{width:min(1040px,100%);margin-top:2vh;animation:modal .4s cubic-bezier(.2,1.2,.3,1) both}
@keyframes fade{from{opacity:0}}
@keyframes modal{from{opacity:0;transform:translateY(26px) scale(.97)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,24px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:all .4s cubic-bezier(.3,1.4,.5,1);z-index:60;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));inset-inline-end:max(18px,env(safe-area-inset-right,0px));z-index:25;border-radius:99px;padding:13px 24px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.sec-title{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.lines input,.lines select,.lines textarea{padding:6px 8px;font-size:13px}
.lines td{padding:5px 6px;vertical-align:top}
.lines .q{width:74px}.lines .m{width:96px}.lines textarea{min-height:44px;min-width:130px;font-family:var(--mono);font-size:12px}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 24px;margin-top:12px;margin-inline-start:auto;width:min(360px,100%);font-size:13px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 24px;font-size:13px}
.kv b{font-weight:800}
.doc{background:#fff;color:#111;border-radius:6px;padding:28px;max-width:820px;margin:0 auto;font-size:13px}
.doc *{color:inherit}
.doc .dh{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #0B1F4D;padding-bottom:14px;margin-bottom:16px;flex-wrap:wrap}
.doc .lg{display:flex;gap:14px;align-items:flex-start}
.doc .lg svg{width:70px;height:70px;color:#0B1F4D;flex:none}
.doc h1{margin:0;font-size:26px;letter-spacing:.04em;color:#0B1F4D}
.doc .tg{font-size:11px;color:#444}
.doc table{font-size:13px}
.doc th{color:#333;border-bottom:2px solid #0B1F4D;background:#f2f2f2}
.doc td{border-bottom:1px solid #ccc;white-space:normal}
.doc .tt{margin-top:14px;margin-inline-start:auto;width:min(320px,100%);display:grid;grid-template-columns:1fr auto;gap:4px 20px}
.doc .sig{display:flex;gap:40px;margin-top:50px}
.doc .sig div{flex:1;border-top:1px solid #111;padding-top:4px;font-size:11px;color:#444}
.doc .mono{font-family:var(--mono)}
.printhead{display:none}
@media(max-width:640px){
  input,select,textarea{font-size:16px}
  body{padding-block:0 100px}
  header.bar{backdrop-filter:none;background:var(--surface)}
  .bar-in{gap:6px 12px;padding-block:10px}.brand small{display:none}.brand{font-size:16px}.brand svg{width:34px;height:34px}
  .acct{margin-inline-start:0;width:100%;justify-content:space-between;gap:10px}.acct .big{font-size:15px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:19px}
  .card{padding:14px}input,select,textarea{font-size:16px}
  .brow{grid-template-columns:minmax(80px,1fr) 1.3fr minmax(90px,1fr)}.sec-title{font-size:19px}
  .doc{padding:16px}
}
@media print{
  :root:root:root:root{--bg:#fff;--surface:#fff;--surface2:#f4f4f4;--ink:#000;--muted:#444;--line:#bbb;--grid:#ddd;--win:#06704f;--loss:#b32040;--accent:#7a5a10;--shadow:none}
  body{background:#fff;padding:0}
  header.bar,.fab,.toast,.noprint,nav.tabs{display:none!important}
  body.modal-open .wrap{display:none}
  .ov{position:static;background:none;padding:0;display:block;backdrop-filter:none;animation:none}
  .ov .card{box-shadow:none;border:0;padding:0;margin:0;width:100%;animation:none}
  .ov .card>h3{display:none}
  .card{box-shadow:none;break-inside:avoid}.card::before{display:none}
  main>*,.stag,tbody tr{animation:none}
  .printhead{display:block;margin-bottom:10px}
  .doc{padding:0;max-width:none}
  .scroll{overflow:visible}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

  S.adjust.forEach(a=>{if(a.prodId===prodId&&a.date<=date&&a.qty>0){q+=a.qty;c+=a.qty*((p&&p.cost)||0)}});
  return Math.round((q>0?c/q:((p&&p.cost)||0))*10000)/10000}

    if(!u){u={id:newId(),no,prodId:l.prodId,purchaseId:pu.id,date:pu.date,cost:0,notes:''};S.units.push(u)}u.prodId=l.prodId;u.date=pu.date;keep[u.id]=1})});

function statsFor(C,r){

  const lc=x.i.lines.map(l=>'<tr><td>'+esc(l.desc)+'</td><td class="r">'+num(usd(l.qty*l.price))+'</td><td class="r">'+num(usd(C.lineCost(l)))+'</td><td class="r">'+num(usd(l.qty*l.price-C.lineCost(l)),cls(l.qty*l.price-C.lineCost(l)))+'</td></tr>').join('');
  openModal('Invoice #'+x.no+' '+pill(x.status),invoiceDocHTML(x)+'<div class="act noprint"><button class="btn pri" type="button" data-print>Print / Save as PDF</button><button class="btn" type="button" data-pay="'+id+'">+ Add payment</button><button class="btn" type="button" data-editinv="'+id+'">Edit</button><button class="btn danger" type="button" data-del="invoices:'+id+'">Delete</button></div>'+
    '<div class="noprint card" style="margin-top:14px;box-shadow:none"><h3><span>Profit on this invoice (private, not printed)</span></h3><div class="scroll"><table><thead><tr><th>Item</th><th class="r">Sold for</th><th class="r">Real cost</th><th class="r">Profit</th></tr></thead><tbody>'+lc+'</tbody></table></div>'+
    '<div class="kv" style="margin-top:10px"><span class="mut">Expenses linked to this sale</span><span class="num">'+usd(x.lx)+'</span><b>Net profit</b><b class="num '+cls(x.net)+'">'+usd(x.net)+'</b></div></div>',null,{nosubmit:1});

function openUnit(id){
  const C=calc(),x=C.um[id];if(!x)return;
  const rows=[['Purchase price',x.base]];
  if(x.share)rows.push(['Share of purchase costs (transport etc., split '+(x.pu&&x.pu.mode==='value'?'by value':'equally per item')+')',x.share]);
  x.ee.forEach(e=>rows.push([e.date+' · '+e.category+(e.payee?' · '+e.payee:'')+(e.currency==='AFN'?' (AFN '+Math.round(e.amount)+')':''),e.usd]));
  x.mm.forEach(m=>rows.push([m.date+' · Material: '+(C.pm[m.prodId]?C.pm[m.prodId].name:'?')+' x '+m.qty,m.cost]));
  openModal('Container '+esc(x.no)+' '+pill(x.status),'<div class="grid g-eq"><div><div class="kv"><span class="mut">Type</span><span>'+esc(x.prod?x.prod.name:'-')+'</span><span class="mut">Acquired</span><span class="num">'+esc(x.u.date||'-')+'</span><span class="mut">Bought from</span><span>'+esc(x.pu&&x.pu.sup?x.pu.sup.name:'-')+'</span>'+(x.soldInvO?'<span class="mut">Sold on</span><span>Invoice #'+x.soldInvO.no+' ('+esc(x.soldInvO.cust?x.soldInvO.cust.name:'Walk-in')+')</span><span class="mut">Sale price</span><span class="num">'+usd(x.price)+'</span>':'')+'</div></div>'+
    '<div><div class="kv">'+rows.map(r=>'<span>'+esc(r[0])+'</span><span class="num">'+usd(r[1])+'</span>').join('')+'<b>Total cost</b><b class="num">'+usd(x.total)+'</b>'+(x.soldInvO?'<b>Net profit</b><b class="num '+cls(x.net)+'">'+usd(x.net)+'</b>':'')+'</div></div></div>',null,{nosubmit:1});
  $('#mform').insertAdjacentHTML('beforeend','<div class="act noprint"><button class="btn pri" type="button" data-addexp="unit:'+id+'">+ Add expense (wage, transport...)</button><button class="btn" type="button" data-addmat="unit:'+id+'">+ Use material</button><button class="btn" type="button" data-edit="units:'+id+'">Edit</button></div>');
}
function openJob(id){
  const C=calc(),x=C.jm[id];if(!x)return;
  const rows=[];x.ee.forEach(e=>rows.push([e.date+' · '+e.category+(e.payee?' · '+e.payee:'')+(e.currency==='AFN'?' (AFN '+Math.round(e.amount)+')':''),e.usd]));
  x.mm.forEach(m=>rows.push([m.date+' · Material: '+(C.pm[m.prodId]?C.pm[m.prodId].name:'?')+' x '+m.qty,m.cost]));
  openModal(esc(x.j.name)+' '+pill(x.j.status),'<div class="grid g-eq"><div class="kv"><span class="mut">Type</span><span>'+esc(x.j.type)+'</span><span class="mut">Customer</span><span>'+esc(x.cust?x.cust.name:'-')+'</span><span class="mut">Started</span><span class="num">'+esc(x.j.start||'-')+'</span><span class="mut">Due</span><span class="num">'+esc(x.j.due||'-')+'</span>'+(x.soldInvO?'<span class="mut">Sold on</span><span>Invoice #'+x.soldInvO.no+'</span><span class="mut">Sale price</span><span class="num">'+usd(x.price)+'</span>':'<span class="mut">Not invoiced yet</span><span></span>')+'</div>'+
    '<div><div class="kv">'+(rows.length?rows.map(r=>'<span>'+esc(r[0])+'</span><span class="num">'+usd(r[1])+'</span>').join(''):'<span class="mut">No costs recorded yet</span><span></span>')+'<b>Total cost so far</b><b class="num">'+usd(x.cost)+'</b>'+(x.soldInvO?'<b>Net profit</b><b class="num '+cls(x.net)+'">'+usd(x.net)+'</b>':'')+'</div></div></div>',null,{nosubmit:1});
  $('#mform').insertAdjacentHTML('beforeend','<div class="act noprint"><button class="btn pri" type="button" data-addexp="job:'+id+'">+ Add expense (wage...)</button><button class="btn" type="button" data-addmat="job:'+id+'">+ Use material</button><button class="btn" type="button" data-edit="jobs:'+id+'">Edit</button></div>');
}

/* ================= period bar ================= */
const PRESETS=[['today','Today'],['week','This week'],['month','This month'],['lastmonth','Last month'],['quarter','This quarter'],['year','This year'],['lastyear','Last year'],['last12','Last 12 months'],['all','All time'],['custom','Custom dates']];
function curRange(){return rangeFor(P.preset,cal(),S.settings.fiscal,S)}
function periodBar(){
  const r=curRange(),isC=P.preset==='custom';
  return '<div class="card pbar noprint"><div class="f"><label>Period<select id="p_preset">'+PRESETS.map(p=>'<option value="'+p[0]+'"'+(p[0]===P.preset?' selected':'')+'>'+p[1]+'</option>').join('')+'</select></label>'+
   (isC?'<label>From<input type="date" id="p_from" value="'+P.from+'"></label><label>To<input type="date" id="p_to" value="'+P.to+'"></label>':'')+
   '<label>Calendar<span class="seg" style="align-self:flex-start"><button type="button" data-cal="greg" aria-pressed="'+(cal()==='greg')+'">Gregorian</button><button type="button" data-cal="jalali" aria-pressed="'+(cal()==='jalali')+'">Solar Hijri</button></span></label>'+
   '<label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px"><input type="checkbox" id="p_cmp" style="width:auto"'+(P.compare?' checked':'')+'> Compare with previous period</label></div>'+
   '<div class="ptxt" style="margin-top:10px"><b class="num">'+r.from+'</b> to <b class="num">'+r.to+'</b> &nbsp;&middot;&nbsp; '+jal(r.from)+' to '+jal(r.to)+'</div></div>'}

/* ================= views ================= */
function vDash(C){
  const r=curRange(),st=statsFor(C,r),pv=r.prev?statsFor(C,r.prev):null;
  let h='';
  if(S.demo)h+='<div class="banner"><span>This system contains <b>example data</b> (invoices 40 to 44, sample containers, jobs, purchases and expenses). Clear it before you start entering real records. New invoices then start from number 1.</span><button class="btn sm danger" data-act="clearDemo">Clear examples</button></div>';
  h+=periodBar();
  h+='<div class="grid g-kpi">'+kpi('Sales',st.sales,st.sales,pv&&pv.sales)+kpi('Real cost of items sold',st.cost,st.cost,pv&&pv.cost,{lowerBetter:1})+kpi('Gross profit',st.gross,st.gross,pv&&pv.gross,{c:cls(st.gross)})+kpi('General expenses',st.opex,st.opex,pv&&pv.opex,{lowerBetter:1,sub:'Rent, salaries... not linked to an item'})+
    kpi('Net profit',st.net,st.net,pv&&pv.net,{c:cls(st.net)})+kpi('Collected',st.coll,st.coll,pv&&pv.coll,{c:'pos'})+kpi('Receivables (end of period)',recAt(C,r.to),recAt(C,r.to),null,{c:'warnc',sub:'Owed by customers'})+kpi('Stock value now',C.stockVal,0,null,{sub:'Containers, materials and jobs in progress, at real cost'})+'</div>';
  const byProd={};C.inv.filter(x=>x.date>=r.from&&x.date<=r.to).forEach(x=>x.i.lines.forEach(l=>{let nm=l.kind==='unit'?(C.um[l.unitId]&&C.um[l.unitId].prod?C.um[l.unitId].prod.name:'Container'):l.kind==='job'?(C.jm[l.jobId]?C.jm[l.jobId].j.type:'Job'):(C.pm[l.prodId]?C.pm[l.prodId].name:'Other');const g=byProd[nm]=byProd[nm]||{k:nm,v:0};g.v+=l.qty*l.price-C.lineCost(l)}));
  const bp=Object.values(byProd).sort((a,b)=>b.v-a.v).slice(0,7);
  const top=Object.values(C.inv.filter(x=>x.date>=r.from&&x.date<=r.to).reduce((m,x)=>{const k=x.cust?x.cust.name:'Walk-in';(m[k]=m[k]||{k,v:0}).v+=x.total;return m},{})).sort((a,b)=>b.v-a.v).slice(0,6);
  const ec=Object.values(S.expenses.filter(e=>e.date>=r.from&&e.date<=r.to).reduce((m,e)=>{(m[e.category]=m[e.category]||{k:e.category,v:0}).v+=e.usd;return m},{})).sort((a,b)=>b.v-a.v);
  h+='<div class="grid g-2"><div class="card"><h3><span>Months in view</span></h3>'+monthChart(C,r)+'</div><div class="card"><h3><span>Unpaid invoices</span></h3>'+
   table([{h:'No'},{h:'Customer'},{h:'Balance',r:1}],C.inv.filter(x=>x.bal>.005).slice(0,8).map(x=>({attr:'data-inv="'+x.id+'"',cells:['#'+x.no,esc(x.cust?x.cust.name:'Walk-in'),num(usd(x.bal),'warnc')]})))+'</div></div>';
  h+='<div class="grid g-auto"><div class="card"><h3><span>Net profit by item type</span></h3>'+barRows(bp,usd,'var(--win)')+'</div><div class="card"><h3><span>Top customers by sales</span></h3>'+barRows(top,usd)+'</div><div class="card"><h3><span>All money spent by category</span></h3>'+barRows(ec,usd,'var(--loss)')+'</div>'+
   '<div class="card"><h3><span>Stock alerts</span></h3>'+(C.stock.filter(s=>s.st!=='OK').length?C.stock.filter(s=>s.st!=='OK').map(s=>'<div class="brow" style="grid-template-columns:1fr auto"><span class="lab">'+esc(s.p.name)+'</span><span>'+num(s.on)+' '+pill(s.st)+'</span></div>').join(''):'<div class="empty">All stock items are fine.</div>')+'</div></div>';
  return h;
}
function searchBar(ph,extra){return '<div class="filters"><input type="search" id="q" placeholder="'+ph+'" value="'+esc(q)+'">'+(extra||'')+'</div>'}
const hit=txt=>!q||txt.toLowerCase().includes(q.toLowerCase());

const payCols=[{h:'Date'},{h:'Invoice'},{h:'Customer'},{h:'Method'},{h:'Amount',r:1},{h:'Notes'}];
const vPay=C=>'<div class="hd"><h2 class="sec-title">Payments received</h2><button class="btn pri" data-new="payments">+ Add payment</button></div>'+searchBar('Search date, method, customer...')+'<div class="card" style="padding:4px 8px" id="tbl">'+table(payCols,payRows(C))+'</div>';
function custRows(C){return S.customers.filter(c=>hit(c.name+' '+c.phone+' '+c.province+' '+c.type)).map(c=>{const xs=C.inv.filter(x=>x.cust&&x.cust.id===c.id),bal=sum(xs,x=>x.bal);return {attr:'data-edit="customers:'+c.id+'"',cells:['<b>'+esc(c.name)+'</b>',esc(c.type),esc(c.phone),esc(c.province),num(xs.length),num(usd(sum(xs,x=>x.total))),num(usd(bal),bal>.005?'warnc':'')+'<button class="btn sm" style="margin-inline-start:8px" data-stmt="'+c.id+'">Statement</button>']}})}
const custCols=[{h:'Name'},{h:'Type'},{h:'Phone'},{h:'Province'},{h:'Invoices',r:1},{h:'Total sales',r:1},{h:'Balance owed',r:1}];
const vCust=C=>'<div class="hd"><h2 class="sec-title">Customers</h2><button class="btn pri" data-new="customers">+ New customer</button></div>'+searchBar('Search name, phone, province...')+'<div class="card" style="padding:4px 8px" id="tbl">'+table(custCols,custRows(C))+'</div>';
function prodRows(C){const sk={};C.stock.forEach(s=>sk[s.p.id]=s);return S.products.filter(p=>hit(p.name+' '+p.category+' '+p.spec)).map(p=>{const kd={Service:'Service / job',Stock:'Stock item',Unit:'Individual units'}[p.kind];

const unitCols=[{h:'Number'},{h:'Type'},{h:'Acquired'},{h:'Purchase price',r:1},{h:'Extra costs',r:1},{h:'Total cost',r:1},{h:'Status'},{h:'Invoice'},{h:'Sold for',r:1},{h:'Net profit',r:1}];
function vUnits(C){const inS=C.units.filter(x=>!x.soldInv);return '<div class="hd"><h2 class="sec-title">Containers / units</h2><button class="btn pri" data-new="units">+ Add unit manually</button></div><p class="mut" style="margin:0;font-size:12px">Units are created when you record a purchase with container numbers. Click a unit to see its full cost and add wages, transport or materials to it. In stock: <b class="num">'+inS.length+'</b> units worth <b class="num">'+usd(sum(inS,x=>x.total))+'</b>.</p>'+

function jobRows(C){return C.jobs.filter(x=>(fil==='all'||(fil==='open'&&!x.soldInv)||(fil==='sold'&&x.soldInv))&&hit(x.j.name+' '+x.j.type+' '+x.j.status+' '+(x.cust?x.cust.name:''))).map(x=>({attr:'data-job="'+x.id+'"',cells:['<b>'+esc(x.j.name)+'</b>',esc(x.j.type),esc(x.cust?x.cust.name:'-'),pill(x.j.status),dual(x.j.due),num(usd(x.cost)),x.soldInvO?'#'+x.soldInvO.no:'<span class="mut">not invoiced</span>',x.soldInvO?num(usd(x.price)):'-',x.soldInvO?num(usd(x.net),cls(x.net)):'-']}))}
const jobCols=[{h:'Job'},{h:'Type'},{h:'Customer'},{h:'Status'},{h:'Due'},{h:'Cost so far',r:1},{h:'Invoice'},{h:'Sold for',r:1},{h:'Net profit',r:1}];

function vPur(C){

const RTYPES=[['summary','Monthly and yearly summary'],['sales','Sales'],['profit','Profit by invoice'],['units','Container profit'],['jobs','Job profit'],['prod','Profit by product'],['recv','Receivables by customer'],['stmt','Customer statement'],['exp','Expenses'],['cash','Cash flow by month'],['stock','Stock valuation'],['pay','Supplier payables']];
const U=v=>({v:v,f:'usd'}),PC=v=>({v:v,f:'pct'});
function buildReport(C){
  const r=curRange(),T=RTYPES.find(x=>x[0]===R.type)[1],o={title:T,tables:[]},inR=d=>d>=r.from&&d<=r.to;
  if(R.type==='summary'){
    const ms=monthsIn(cal(),r.from,r.to),fs=S.settings.fiscal;
    const row=(label,x)=>{const s=statsFor(C,x);return [label,U(s.sales),U(s.cost),U(s.gross),U(s.opex),U(s.net),U(s.coll)]};
    const cols=['Period','Sales','Real cost of items sold','Gross profit','General expenses','Net profit','Collected'];
    const mr=ms.map(m=>row(monthName(cal(),m.y,m.m),m));
    o.tables.push({title:'By month',cols,rows:mr,foot:['Total',...[1,2,3,4,5,6].map(j=>U(sum(mr,x=>x[j].v)))]});
    const yrs={};ms.forEach(m=>{const fy=m.m>=fs?m.y:m.y-1;(yrs[fy]=yrs[fy]||[]).push(m)});
    const yr=Object.keys(yrs).sort().map(k=>row((fs>1?'Fiscal year ':'Year ')+k,{from:yrs[k][0].from,to:yrs[k][yrs[k].length-1].to}));
    o.tables.push({title:'By year',cols,rows:yr,foot:['Total',...[1,2,3,4,5,6].map(j=>U(sum(yr,x=>x[j].v)))]})}
  if(R.type==='sales'){const xs=C.inv.filter(x=>inR(x.date)).sort((a,b)=>a.no-b.no);o.tables.push({cols:['Invoice','Date','Customer','Total','Paid','Balance','Gross profit'],rows:xs.map(x=>['#'+x.no,x.date,x.cust?x.cust.name:'Walk-in',U(x.total),U(x.paid),U(x.bal),U(x.gross)]),foot:['Total','','',U(sum(xs,x=>x.total)),U(sum(xs,x=>x.paid)),U(sum(xs,x=>x.bal)),U(sum(xs,x=>x.gross))]})}
  if(R.type==='profit'){const xs=C.inv.filter(x=>inR(x.date)).sort((a,b)=>a.no-b.no);o.tables.push({cols:['Invoice','Date','Customer','Sales','Real cost','Gross','Linked expenses','Net profit','Margin'],rows:xs.map(x=>['#'+x.no,x.date,x.cust?x.cust.name:'Walk-in',U(x.total),U(x.cost),U(x.gross),U(x.lx),U(x.net),PC(x.total?x.net/x.total*100:0)]),foot:['Total','','',U(sum(xs,x=>x.total)),U(sum(xs,x=>x.cost)),U(sum(xs,x=>x.gross)),U(sum(xs,x=>x.lx)),U(sum(xs,x=>x.net)),PC(sum(xs,x=>x.total)?sum(xs,x=>x.net)/sum(xs,x=>x.total)*100:0)]})}
  if(R.type==='units'){const us=C.units.filter(x=>x.soldInvO?inR(x.soldInvO.date):false).sort((a,b)=>a.no<b.no?-1:1);o.title='Container profit (sold in period)';
    o.tables.push({title:'Sold containers',cols:['Number','Type','Purchase price','Purchase costs share','Expenses','Materials','Total cost','Sold for','Net profit','Margin'],rows:us.map(x=>[x.no,x.prod?x.prod.name:'',U(x.base),U(x.share),U(x.expD),U(x.matD),U(x.total),U(x.price),U(x.net),PC(x.price?x.net/x.price*100:0)]),foot:['Total','',U(sum(us,x=>x.base)),U(sum(us,x=>x.share)),U(sum(us,x=>x.expD)),U(sum(us,x=>x.matD)),U(sum(us,x=>x.total)),U(sum(us,x=>x.price)),U(sum(us,x=>x.net)),'']});
    const st=C.units.filter(x=>!x.soldInv);o.tables.push({title:'Containers in stock now',cols:['Number','Type','Purchase price','Extra costs','Total cost'],rows:st.map(x=>[x.no,x.prod?x.prod.name:'',U(x.base),U(x.total-x.base),U(x.total)]),foot:['Total','','','',U(sum(st,x=>x.total))]})}
  if(R.type==='jobs'){const js=C.jobs.filter(x=>x.soldInvO?inR(x.soldInvO.date):false);o.title='Job profit (invoiced in period)';
    o.tables.push({title:'Invoiced jobs',cols:['Job','Type','Customer','Wages and expenses','Materials','Total cost','Sold for','Net profit','Margin'],rows:js.map(x=>[x.j.name,x.j.type,x.cust?x.cust.name:'-',U(x.expD),U(x.matD),U(x.cost),U(x.price),U(x.net),PC(x.price?x.net/x.price*100:0)]),foot:['Total','','',U(sum(js,x=>x.expD)),U(sum(js,x=>x.matD)),U(sum(js,x=>x.cost)),U(sum(js,x=>x.price)),U(sum(js,x=>x.net)),'']});
    const op=C.jobs.filter(x=>!x.soldInv);o.tables.push({title:'Jobs not invoiced yet',cols:['Job','Status','Cost so far'],rows:op.map(x=>[x.j.name,x.j.status,U(x.cost)]),foot:['Total','',U(sum(op,x=>x.cost))]})}
  if(R.type==='prod'){const m={};C.inv.filter(x=>inR(x.date)).forEach(x=>x.i.lines.forEach(l=>{let nm,pid=l.prodId;if(l.kind==='unit'){const u=C.um[l.unitId];nm=u&&u.prod?u.prod.name:'Container'}else if(l.kind==='job'){const j=C.jm[l.jobId];nm='Job: '+(j?j.j.type:'')}else nm=C.pm[pid]?C.pm[pid].name:'Other';
      const g=m[nm]=m[nm]||{k:nm,q:0,rev:0,cost:0};g.q+=l.qty;g.rev+=l.qty*l.price;g.cost+=C.lineCost(l)}));
    const rs=Object.values(m).sort((a,b)=>(b.rev-b.cost)-(a.rev-a.cost));o.tables.push({cols:['Product / type','Sold qty','Revenue','Real cost','Net profit','Margin'],rows:rs.map(g=>[g.k,g.q,U(g.rev),U(g.cost),U(g.rev-g.cost),PC(g.rev?(g.rev-g.cost)/g.rev*100:0)]),foot:['Total',sum(rs,g=>g.q),U(sum(rs,g=>g.rev)),U(sum(rs,g=>g.cost)),U(sum(rs,g=>g.rev-g.cost)),'']});
    const bm={};C.pur.filter(x=>inR(x.date)).forEach(x=>x.lines.forEach(ln=>{const p=C.pm[ln.l.prodId],k=p?p.name:ln.l.desc,g=bm[k]=bm[k]||{k,q:0,c:0};g.q+=ln.qty;g.c+=ln.qty*(ln.usd+ln.share)}));
    const bs=Object.values(bm);o.tables.push({title:'Bought in the same period',cols:['Product','Qty bought','Cost incl. shared costs'],rows:bs.map(g=>[g.k,g.q,U(g.c)]),foot:['Total',sum(bs,g=>g.q),U(sum(bs,g=>g.c))]})}
  if(R.type==='recv'){o.title='Money owed to us on '+r.to;const m={};C.inv.filter(x=>x.date<=r.to).forEach(x=>{const pd=sum(x.pays.filter(p=>p.date<=r.to),p=>p.usd),bl=x.total-pd;if(bl<=.005)return;const k=x.cust?x.cust.name:'Walk-in',g=m[k]=m[k]||{k,n:0,t:0,p:0,b:0};g.n++;g.t+=x.total;g.p+=pd;g.b+=bl});const rs=Object.values(m).sort((a,b)=>b.b-a.b);o.tables.push({cols:['Customer','Open invoices','Invoiced','Paid','Balance owed'],rows:rs.map(g=>[g.k,g.n,U(g.t),U(g.p),U(g.b)]),foot:['Total',sum(rs,g=>g.n),U(sum(rs,g=>g.t)),U(sum(rs,g=>g.p)),U(sum(rs,g=>g.b))]})}
  if(R.type==='stmt'){const c=S.customers.find(x=>x.id===+R.cust)||S.customers[0];if(!c){o.tables.push({cols:['Info'],rows:[['No customers yet']]});return o}o.title='Statement: '+c.name;const ev=[];C.inv.filter(x=>x.cust&&x.cust.id===c.id&&x.date<=r.to).forEach(x=>{ev.push({d:x.date,t:'Invoice #'+x.no,db:x.total,cr:0});x.pays.filter(p=>p.date<=r.to).forEach(p=>ev.push({d:p.date,t:'Payment ('+p.method+') for #'+x.no,db:0,cr:p.usd}))});ev.sort((a,b)=>a.d<b.d?-1:1);let bal=0;
    o.tables.push({cols:['Date','Description','Charged','Paid','Balance'],rows:ev.map(e=>{bal+=e.db-e.cr;return [e.d,e.t,e.db?U(e.db):'',e.cr?U(e.cr):'',U(bal)]}),foot:['Balance owed','',U(sum(ev,e=>e.db)),U(sum(ev,e=>e.cr)),U(bal)]})}
  if(R.type==='exp'){const es=S.expenses.filter(e=>inR(e.date)).sort((a,b)=>a.date<b.date?-1:1),m={};es.forEach(e=>{const g=m[e.category]=m[e.category]||{k:e.category,n:0,v:0};g.n++;g.v+=e.usd});
    o.tables.push({title:'By category',cols:['Category','Records','Total'],rows:Object.values(m).sort((a,b)=>b.v-a.v).map(g=>[g.k,g.n,U(g.v)]),foot:['Total',es.length,U(sum(es,e=>e.usd))]});
    o.tables.push({title:'All records',cols:['Date','Category','Paid to','Belongs to','Amount'],rows:es.map(e=>[e.date,e.category,e.payee||'',expTargetName(C,e),U(e.usd)])})}
  if(R.type==='cash'){const ks={};const add=(k,f,v)=>{const g=ks[k]=ks[k]||{k,i:0,e:0,s:0};g[f]+=v};S.payments.filter(p=>inR(p.date)).forEach(p=>add(mkey(p.date),'i',p.usd));S.expenses.filter(e=>inR(e.date)).forEach(e=>add(mkey(e.date),'e',e.usd));S.purchases.filter(p=>inR(p.date)).forEach(p=>add(mkey(p.date),'s',p.paid||0));
    const rs=Object.values(ks).sort((a,b)=>a.k<b.k?-1:1);o.tables.push({cols:['Month (Gregorian)','Money in','Expenses paid','Supplier payments','Net cash'],rows:rs.map(g=>[g.k,U(g.i),U(g.e),U(g.s),U(g.i-g.e-g.s)]),foot:['Total',U(sum(rs,g=>g.i)),U(sum(rs,g=>g.e)),U(sum(rs,g=>g.s)),U(sum(rs,g=>g.i-g.e-g.s))]})}
  if(R.type==='stock'){const us=C.units.filter(x=>!x.soldInv);o.tables.push({title:'Containers in stock',cols:['Number','Type','Total cost'],rows:us.map(x=>[x.no,x.prod?x.prod.name:'',U(x.total)]),foot:['Total','',U(sum(us,x=>x.total))]});
    o.tables.push({title:'Stock items',cols:['Item','On hand','Avg cost','Value','Status'],rows:C.stock.map(s=>[s.p.name,s.on,U(s.avg),U(Math.max(0,s.val)),s.st]),foot:['Total','','',U(sum(C.stock,s=>Math.max(0,s.val))),'']});
    const jb=C.jobs.filter(x=>!x.soldInv);o.tables.push({title:'Jobs in progress (cost so far)',cols:['Job','Status','Cost so far'],rows:jb.map(x=>[x.j.name,x.j.status,U(x.cost)]),foot:['Total','',U(sum(jb,x=>x.cost))]})}
  if(R.type==='pay'){const rs=C.pur.filter(x=>x.due>.005);o.tables.push({cols:['Date','Supplier','Total','Paid','We owe'],rows:rs.map(x=>[x.date,x.sup?x.sup.name:'-',U(x.total),U(x.paid),U(x.due)]),foot:['Total','','',U(sum(rs,x=>x.total)),U(sum(rs,x=>x.due))]})}
  return o;
}

function doDelete(n,id){
  const C=calc();
  if(n==='invoices'){S.payments=S.payments.filter(p=>p.invoiceId!==id);S.expenses.forEach(x=>{if(x.linkType==='invoice'&&x.linkId===id){x.linkType='none';x.linkId=''}})}
  if(n==='units'){const u=C.um[id];if(u&&u.soldInv){toast('This container is on an invoice. Remove it from the invoice first.');return}if(u&&u.pu){toast('This container came from a purchase. Edit the purchase to remove it.');return}S.expenses.forEach(x=>{if(x.linkType==='unit'&&x.linkId===id){x.linkType='none';x.linkId=''}});S.materials=S.materials.filter(m=>!(m.targetType==='unit'&&m.targetId===id))}
  if(n==='jobs'){const j=C.jm[id];if(j&&j.soldInv){toast('This job is on an invoice. Remove it from the invoice first.');return}S.expenses.forEach(x=>{if(x.linkType==='job'&&x.linkId===id){x.linkType='none';x.linkId=''}});S.materials=S.materials.filter(m=>!(m.targetType==='job'&&m.targetId===id))}
  if(n==='purchases'){const pu=C.pum[id];if(pu&&S.units.some(u=>u.purchaseId===id&&C.um[u.id].soldInv)){toast('Some containers from this purchase are already sold.');return}S.units=S.units.filter(u=>u.purchaseId!==id);S.expenses.forEach(x=>{if(x.linkType==='purchase'&&x.linkId===id){x.linkType='none';x.linkId=''}})}
  S[n]=S[n].filter(x=>x.id!==id);save();closeModal();render();toast('Deleted');
}

function hash(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return (h>>>0).toString(16)}

/* Reads a backup text. Returns {d} or {err}. Accepts the new wrapped format and older plain files. */
function readBackup(text){let d;try{d=JSON.parse(text)}catch(e){return {err:'The file is damaged (it cannot be read).'}}
  if(d&&d.meta&&d.data){if(d.meta.check&&d.meta.check!==hash(JSON.stringify(d.data)))return {err:'The file was changed or is damaged (the safety check does not match).'};
    if(d.meta.counts){for(const k in d.meta.counts){if(((d.data[k]||[]).length)!==d.meta.counts[k])return {err:'The file is incomplete: the number of '+k+' does not match.'}}}
    d=d.data}
  const err=validateBackup(d,true);return err?{err}:{d}}

    if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).then(()=>toast('Saved. Choose Save to Files to keep it.'),e=>{if(!e||e.name!=='AbortError')dlFile(name,text,mime)});return}}catch(e){}}
  dlFile(name,text,mime)}
